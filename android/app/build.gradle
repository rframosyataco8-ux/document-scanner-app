plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Descomenta cuando tengas google-services.json en android/app/:
    // id "com.google.gms.google-services"
}

android {
    namespace = "com.example.document_scanner_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.romex.docscanpro"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Firma debug solo para pruebas; para Play Store genera keystore propio
            signingConfig = signingConfigs.debug
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
